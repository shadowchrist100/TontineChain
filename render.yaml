services:
  # ── Frontend React (Vite) ──────────────────────────────────────────
  - type: web
    name: tontinechain-frontend
    runtime: static
    rootDir: front                   # ← Render build depuis le dossier front/
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      # Toutes les routes renvoyées vers index.html (SPA React Router)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # à renseigner manuellement dans le dashboard Render
      - key: VITE_WS_URL
        sync: false
      - key: VITE_BLOCKCHAIN_RPC_URL
        sync: false
      - key: VITE_ENV
        value: production

